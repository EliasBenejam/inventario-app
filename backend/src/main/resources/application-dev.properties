# =========================================================
# Perfil DEV: base de datos H2 en memoria
# Util para probar el proyecto sin conexion a Supabase (SPRING_PROFILES_ACTIVE=dev).
# Se pierde la informacion al reiniciar la aplicacion.
# =========================================================
spring.datasource.url=jdbc:h2:mem:inventariodb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
