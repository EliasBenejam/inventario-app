# =========================================================
# Perfil SUPABASE (por defecto): base de datos PostgreSQL en la nube.
#
# Las credenciales NO se escriben aca. Se toman de backend/.env
# (copiar backend/.env.example y completarlo) o de variables de entorno:
#   SUPABASE_DB_URL      jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#   SUPABASE_DB_USER     postgres.<id-del-proyecto>
#   SUPABASE_DB_PASSWORD contrasena de la base de datos
# Las tablas se crean con database/schema.sql (SQL Editor de Supabase).
# =========================================================
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# El plan gratuito de Supabase limita las conexiones simultaneas.
spring.datasource.hikari.maximum-pool-size=5

# update: si las tablas ya existen (creadas con el script) solo agrega lo que falte.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
