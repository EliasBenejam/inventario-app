# =========================================================
# Configuracion general de la aplicacion
# =========================================================
spring.application.name=inventario

# Perfil activo por defecto:
#  - supabase -> base de datos PostgreSQL en la nube (Supabase). Base principal del proyecto.
#  - dev      -> base H2 en memoria, para probar sin conexion ni credenciales
#                (ejecutar con SPRING_PROFILES_ACTIVE=dev).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:supabase}

# Credenciales de Supabase: se leen del archivo backend/.env (no se sube al repositorio).
# Se buscan las dos rutas porque VS Code ejecuta desde la raiz del proyecto
# y Maven (mvn spring-boot:run) desde la carpeta backend.
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

server.port=8080

# JWT
# En produccion definir la variable de entorno JWT_SECRET (o ponerla en backend/.env).
app.jwt.secret=${JWT_SECRET:cambiar-esta-clave-secreta-en-produccion-por-una-mas-larga-y-segura-1234567890}
app.jwt.expiration-ms=86400000

# Manejo de errores
server.error.include-message=always
